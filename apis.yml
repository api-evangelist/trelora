aid: trelora
name: Trelora
description: >-
  Trelora is a technology-driven, full-service discount real estate brokerage
  founded in Denver, Colorado and now operating as part of HomeSmart. It lets
  people buy and sell homes for a low, transparent fee instead of the
  traditional percentage-based commission, helping sellers save thousands of
  dollars and offering buyers cash-back rebates of up to several thousand
  dollars at closing. Trelora pairs salaried, non-commissioned real estate
  agents with an online platform and IDX-powered property search across markets
  including Colorado, Washington, and other U.S. states, and publishes a real
  estate blog, glossary, and city-level market reports. Originally a
  Techstars-backed startup, Trelora is consumer-facing and does not currently
  expose a public developer API.
